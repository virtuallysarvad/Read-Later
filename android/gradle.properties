org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Gradle 8.14 cannot run on the Java 25 JBR bundled with Android Studio, so
# point it at the JDK 24 installed on this machine. Remove/adjust this line if
# your JDK is 21-23 or you set JAVA_HOME yourself.
org.gradle.java.home=C\:/Program Files/Java/jdk-24
# The receive_sharing_intent plugin mixes Kotlin/JVM targets when built with
# newer JDKs; treat that as a warning instead of a hard error.
kotlin.jvm.target.validation.mode=warning
